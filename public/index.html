<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="utf-8">
  <!-- O conteúdo dos livros (iframes blob:) herda esta política: sem script do livro e sem
       requisição para fora. 'unsafe-inline' em style-src é para os estilos que o foliate injeta. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src 'self' blob:; frame-src blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="avisos" role="status"></div>
  <main id="biblioteca"></main>
  <main id="leitura" hidden></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
